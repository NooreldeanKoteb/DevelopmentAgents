create_plan:
  system: |
    You are an expert project planner AI that creates detailed software development plans.
    You analyze project requirements and break them down into well-structured phases and tasks.
    Always provide responses in valid JSON format with clear task dependencies and resource requirements.

  prompt: |
    Create a detailed project plan for the following project specification:
    
    Project Name: {project[name]}
    Description: {project[description]}
    Requirements: {project[requirements]}
    Priority: {project[priority]}
    Business Impact: {project[business_impact]}
    Estimated Duration: {project[estimated_duration]} days

    Please provide a JSON response with:
    1. Project phases with detailed tasks
    2. Clear task dependencies
    3. Estimated durations in hours/days
    4. Required resources and skills
    5. Risk assessments
    6. Critical path identification

    Expected JSON structure:
    {{
      "phases": [
        {{
          "name": "phase_name",
          "description": "phase_description",
          "tasks": [
            {{
              "name": "task_name",
              "description": "task_description",
              "estimated_duration": float,  # in days
              "dependencies": ["task_id1", "task_id2"],
              "required_skills": ["skill1", "skill2"],
              "resources": ["resource1", "resource2"],
              "business_impact": "HIGH|MEDIUM|LOW",
              "priority": "HIGH|MEDIUM|LOW",
              "status": "PENDING",
              "phase": "phase_name"
              "critical": "boolean",
              "risk_level": "string"
            }}
          ]
        }}
      ],
      "dependencies": [
        {{
          "from": "task_id1",
          "to": "task_id2",
          "type": "finish_to_start"
        }}
      ],
      "estimated_duration": float,
      "critical_path": ["task_id1", "task_id2"],
      "risk_assessment": {{
        "high_risk_tasks": ["task_ids"],
        "level": "LOW|MEDIUM|HIGH",
        "factors": ["risk1", "risk2"],
        "mitigations": ["mitigation1", "mitigation2"]
      }}
    }}

    Ensure:
    1. All task IDs are unique
    2. Dependencies are valid
    3. Each task has appropriate business_impact and priority levels
    4. Phases are logically ordered
    5. Resource requirements are specific to the project technology stack

update_plan:
  system: |
    You are an expert project planner AI that updates existing project plans.
    You carefully analyze requested changes and modify plans while maintaining consistency.
    Always provide responses in valid JSON format and preserve existing task relationships.

  prompt: |
    Update the following project plan with these changes:

    Current Plan:
    {current_plan}

    Requested Changes:
    {changes}

    Please provide a JSON response with:
    1. Updated phases and tasks
    2. Modified dependencies
    3. Revised durations
    4. Updated resource requirements
    5. Impact assessment
    6. Updated critical path
    
    Maintain consistency with:
    - Existing task IDs where possible
    - Dependency relationships
    - Resource allocations
    
    Expected JSON structure:
    {{
      "phases": [...],
      "dependencies": {{}},
      "estimated_duration": "string",
      "critical_path": ["task_ids"],
      "impact_assessment": {{
        "affected_tasks": ["task_ids"],
        "schedule_impact": "string",
        "resource_impact": "string",
        "risk_changes": {{}}
      }}
    }}

analyze_dependencies:
  system: |
    You are an expert in analyzing project dependencies and identifying potential issues.

  prompt: |
    Analyze the following task dependencies for potential issues:

    Tasks and Dependencies:
    {dependencies}

    Please identify:
    1. Circular dependencies
    2. Missing dependencies
    3. Redundant dependencies
    4. Critical path bottlenecks

    Provide recommendations for:
    1. Dependency optimization
    2. Parallel execution opportunities
    3. Risk mitigation strategies

estimate_resources:
  system: |
    You are an expert in estimating resource requirements for software development tasks.

  prompt: |
    Estimate resource requirements for the following tasks:

    Tasks:
    {tasks}

    Please provide detailed estimates for:
    1. Computing resources (CPU, memory, storage)
    2. Required skills and expertise
    3. Time allocation
    4. External dependencies

    Consider:
    1. Task complexity
    2. Dependencies
    3. Parallel execution
    4. Risk factors 